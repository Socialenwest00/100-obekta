<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#166534">

  <title>100 НТО 🇧🇬</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    #app {
      min-height: 100vh;
      padding-bottom: 70px;
    }

    header {
      background: #166534;
      color: white;
      padding: 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .9;
      font-size: 13px;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    #map {
      width: 100%;
      height: calc(100vh - 139px);
      min-height: 500px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #ddd;
      z-index: 9999;
      padding-bottom: env(safe-area-inset-bottom);
    }

    .nav-button {
      border: none;
      background: white;
      font-size: 12px;
      color: #555;
    }

    .nav-button.active {
      color: #166534;
      font-weight: bold;
    }

    .nav-icon {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    .content {
      max-width: 700px;
      margin: auto;
      padding: 12px;
    }

    .search {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    .object-card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 7px rgba(0,0,0,.08);
    }

    .object-number {
      color: #777;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .object-card h2 {
      font-size: 18px;
      margin: 0 0 6px;
    }

    .location {
      color: #666;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .status.no {
      background: #ffebee;
      color: #c62828;
    }

    .status.yes {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .checks {
      display: grid;
      gap: 9px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 15px;
    }

    .check input {
      width: 20px;
      height: 20px;
      accent-color: #166534;
    }

    .date {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .note {
      width: 100%;
      min-height: 70px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: inherit;
      resize: vertical;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: white;
      border-radius: 14px;
      padding: 18px 10px;
      text-align: center;
      box-shadow: 0 2px 7px rgba(0,0,0,.07);
    }

    .stat-number {
      font-size: 28px;
      font-weight: bold;
      color: #166534;
    }

    .stat-label {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    .progress-container {
      background: #ddd;
      border-radius: 20px;
      height: 13px;
      overflow: hidden;
      margin-top: 15px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #166534;
      transition: width .3s;
    }

    .achievement {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-top: 15px;
      box-shadow: 0 2px 7px rgba(0,0,0,.07);
    }

    .achievement h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .achievement-row {
      padding: 9px 0;
      border-bottom: 1px solid #eee;
    }

    .achievement-row:last-child {
      border-bottom: none;
    }

    .leaflet-popup-content {
      font-size: 14px;
    }

    .map-popup-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 5px;
    }
  </style>
</head>

<body>

<div id="app">

  <header>
    <h1>🇧🇬 100 НТО</h1>
    <p>Моят личен туристически дневник</p>
  </header>

  <!-- MAP -->
  <section id="mapScreen" class="screen active">
    <div id="map"></div>
  </section>

  <!-- OBJECTS -->
  <section id="objectsScreen" class="screen">
    <div class="content">

      <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Търси обект..."
        oninput="renderObjects()"
      >

      <div id="objectList"></div>

    </div>
  </section>

  <!-- PROGRESS -->
  <section id="progressScreen" class="screen">
    <div class="content">

      <div class="stats-grid">

        <div class="stat">
          <div id="visitedCount" class="stat-number">0</div>
          <div class="stat-label">🟢 Посетени</div>
        </div>

        <div class="stat">
          <div id="stampCount" class="stat-number">0</div>
          <div class="stat-label">🖋️ Печати</div>
        </div>

        <div class="stat">
          <div id="markCount" class="stat-number">0</div>
          <div class="stat-label">🎫 Марки</div>
        </div>

        <div class="stat">
          <div id="completeCount" class="stat-number">0</div>
          <div class="stat-label">⭐ Пълен комплект</div>
        </div>

      </div>

      <div class="achievement">

        <h2>🏆 Прогрес</h2>

        <div id="achievementText">
          Започни своето приключение!
        </div>

        <div class="progress-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>

      </div>

    </div>
  </section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    id="navMap"
    class="nav-button active"
    onclick="showScreen('map')">

    <span class="nav-icon">🗺️</span>
    Карта

  </button>

  <button
    id="navObjects"
    class="nav-button"
    onclick="showScreen('objects')">

    <span class="nav-icon">📋</span>
    Обекти

  </button>

  <button
    id="navProgress"
    class="nav-button"
    onclick="showScreen('progress')">

    <span class="nav-icon">🏆</span>
    Прогрес

  </button>

</nav>


<!-- LEAFLET -->

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

const objects = [

  {
    id: 1,
    number: "1",
    name: "Рилски манастир",
    city: "Рилски манастир",
    lat: 42.1337,
    lng: 23.3402
  },

  {
    id: 2,
    number: "72",
    name: "Монумент „Св. Богородица“",
    city: "Хасково",
    lat: 41.9277,
    lng: 25.5557
  }

];


let map;
let markers = [];


function getData(id) {

  return JSON.parse(
    localStorage.getItem("object-" + id) || "{}"
  );

}


function saveData(id, data) {

  localStorage.setItem(
    "object-" + id,
    JSON.stringify(data)
  );

}


function updateObject(id, field, value) {

  const data = getData(id);

  data[field] = value;

  saveData(id, data);

  updateEverything();

}


function renderObjects() {

  const search =
    document.getElementById("search")
      .value
      .toLowerCase();

  const list =
    document.getElementById("objectList");

  list.innerHTML = "";

  objects
    .filter(object =>
      (object.name + " " + object.city + " " + object.number)
        .toLowerCase()
        .includes(search)
    )
    .forEach(object => {

      const data = getData(object.id);

      const card =
        document.createElement("div");

      card.className = "object-card";

      card.innerHTML = `

        <div class="object-number">
          Обект №${object.number}
        </div>

        <h2>${object.name}</h2>

        <div class="location">
          📍 ${object.city}
        </div>

        <div class="status ${data.visited ? "yes" : "no"}">
          ${data.visited ? "🟢 Посетен" : "🔴 Не е посетен"}
        </div>

        <div class="checks">

          <label class="check">
            <input
              type="checkbox"
              ${data.visited ? "checked" : ""}
              onchange="updateObject(${object.id}, 'visited', this.checked)"
            >
            Посетен
          </label>

          <label class="check">
            <input
              type="checkbox"
              ${data.stamp ? "checked" : ""}
              onchange="updateObject(${object.id}, 'stamp', this.checked)"
            >
            🖋️ Имам печат
          </label>

          <label class="check">
            <input
              type="checkbox"
              ${data.mark ? "checked" : ""}
              onchange="updateObject(${object.id}, 'mark', this.checked)"
            >
            🎫 Имам марка
          </label>

        </div>

        <input
          class="date"
          type="date"
          value="${data.date || ""}"
          onchange="updateObject(${object.id}, 'date', this.value)"
        >

        <textarea
          class="note"
          placeholder="📝 Моя бележка..."
          onchange="updateObject(${object.id}, 'note', this.value)"
        >${data.note || ""}</textarea>

      `;

      list.appendChild(card);

    });

}


function updateStats() {

  let visited = 0;
  let stamps = 0;
  let marks = 0;
  let complete = 0;


  objects.forEach(object => {

    const data = getData(object.id);

    if (data.visited)
      visited++;

    if (data.stamp)
      stamps++;

    if (data.mark)
      marks++;

    if (
      data.visited &&
      data.stamp &&
      data.mark
    ) {
      complete++;
    }

  });


  document.getElementById(
    "visitedCount"
  ).innerText = visited;


  document.getElementById(
    "stampCount"
  ).innerText = stamps;


  document.getElementById(
    "markCount"
  ).innerText = marks;


  document.getElementById(
    "completeCount"
  ).innerText = complete;


  const percentage =
    (visited / objects.length) * 100;


  document.getElementById(
    "progressBar"
  ).style.width =
    percentage + "%";


  if (visited >= 100) {

    document.getElementById(
      "achievementText"
    ).innerText =
      "🥇 100 посетени обекта!";

  } else if (visited >= 50) {

    document.getElementById(
      "achievementText"
    ).innerText =
      "🥈 50 посетени обекта!";

  } else if (visited >= 25) {

    document.getElementById(
      "achievementText"
    ).innerText =
      "🥉 25 посетени обекта!";

  } else {

    document.getElementById(
      "achievementText"
    ).innerText =
      `Посетени: ${visited} / ${objects.length}`;

  }

}


function createMap() {

  map = L.map("map").setView(
    [42.7339, 25.4858],
    7
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  objects.forEach(object => {

    const data =
      getData(object.id);


    const marker =
      L.marker([
        object.lat,
        object.lng
      ]).addTo(map);


    marker.bindPopup(`

      <div class="map-popup-title">
        ${object.name}
      </div>

      📍 ${object.city}<br>

      ${data.visited
        ? "🟢 Посетен"
        : "🔴 Не е посетен"}

    `);


    markers.push({
      object,
      marker
    });

  });

}


function showScreen(screen) {

  document
    .querySelectorAll(".screen")
    .forEach(element =>
      element.classList.remove("active")
    );


  document
    .querySelectorAll(".nav-button")
    .forEach(element =>
      element.classList.remove("active")
    );


  if (screen === "map") {

    document
      .getElementById("mapScreen")
      .classList.add("active");

    document
      .getElementById("navMap")
      .classList.add("active");


    setTimeout(() => {

      if (map)
        map.invalidateSize();

    }, 100);

  }


  if (screen === "objects") {

    document
      .getElementById("objectsScreen")
      .classList.add("active");

    document
      .getElementById("navObjects")
      .classList.add("active");

    renderObjects();

  }


  if (screen === "progress") {

    document
      .getElementById("progressScreen")
      .classList.add("active");

    document
      .getElementById("navProgress")
      .classList.add("active");

    updateStats();

  }

}


function updateEverything() {

  renderObjects();
  updateStats();

}


createMap();
renderObjects();
updateStats();


if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register(
    "./service-worker.js"
  );

}

</script>

</body>
</html>
