<!DOCTYPE html>
<html lang="bg">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100-те национални обекта</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #1b5e20;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 24px;
    }

    #progress {
      font-size: 18px;
    }

    .place {
      background: white;
      margin: 15px;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .place h2 {
      margin-top: 0;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .not-visited {
      background: #d32f2f;
      color: white;
    }

    .visited {
      background: #2e7d32;
      color: white;
    }
  </style>
</head>

<body>

<header>
  <h1>🇧🇬 100-те национални обекта</h1>
  <div id="progress">Посетени: 0 / 2</div>
</header>

<div class="place">
  <h2>📍 Рилски манастир</h2>
  <p>Рилски манастир „Св. Иван Рилски“</p>

  <button id="button-1"
          class="not-visited"
          onclick="toggleVisited(1)">
    ❌ Не съм посещавал
  </button>
</div>

<div class="place">
  <h2>📍 Монумент „Св. Богородица“ – Хасково</h2>
  <p>Хасково</p>

  <button id="button-2"
          class="not-visited"
          onclick="toggleVisited(2)">
    ❌ Не съм посещавал
  </button>
</div>

<script>
  let visited =
    JSON.parse(localStorage.getItem("visited") || "[]");

  function updatePage() {
    document.getElementById("progress").innerText =
      "Посетени: " + visited.length + " / 2";

    for (let id = 1; id <= 2; id++) {
      const button =
        document.getElementById("button-" + id);

      if (visited.includes(id)) {
        button.className = "visited";
        button.innerText = "✅ Посетено";
      } else {
        button.className = "not-visited";
        button.innerText = "❌ Не съм посещавал";
      }
    }
  }

  function toggleVisited(id) {
    if (visited.includes(id)) {
      visited = visited.filter(item => item !== id);
    } else {
      visited.push(id);
    }

    localStorage.setItem(
      "visited",
      JSON.stringify(visited)
    );

    updatePage();
  }

  updatePage();
</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>
</body>
</html>
