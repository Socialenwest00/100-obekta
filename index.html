<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100 НТО</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#166534">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#166534;
color:white;
padding:15px;
text-align:center;
}

#map{
height:55vh;
}

.tabs{
display:flex;
background:white;
border-bottom:1px solid #ddd;
}

.tabs button{
flex:1;
padding:12px;
border:none;
background:white;
font-size:15px;
}

.tabs button.active{
color:#166534;
font-weight:bold;
}

.page{
display:none;
padding:12px;
}

.page.active{
display:block;
}

.card{
background:white;
padding:14px;
border-radius:14px;
margin-bottom:12px;
box-shadow:0 2px 6px rgba(0,0,0,.08);
}

input[type=search]{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-bottom:12px;
}

label{
display:flex;
align-items:center;
gap:8px;
margin:8px 0;
}

textarea{
width:100%;
min-height:60px;
margin-top:8px;
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.stat{
background:white;
padding:20px;
border-radius:14px;
text-align:center;
}

.big{
font-size:28px;
font-weight:bold;
color:#166534;
}
</style>
</head>

<body>

<header>
<h2>🇧🇬 100 НТО</h2>
<div>Моят личен туристически дневник</div>
</header>

<div class="tabs">
<button id="b1" class="active" onclick="openTab('map')">🗺️ Карта</button>
<button id="b2" onclick="openTab('list')">📋 Обекти</button>
<button id="b3" onclick="openTab('progress')">🏆 Прогрес</button>
</div>

<div id="mapPage" class="page active">
<div id="map"></div>
</div>

<div id="listPage" class="page">
<input id="search" type="search" placeholder="Търси..." oninput="renderList()">
<div id="list"></div>
</div>

<div id="progressPage" class="page">
<div class="stats">

<div class="stat">
<div id="v" class="big">0</div>
Посетени
</div>

<div class="stat">
<div id="s" class="big">0</div>
Печати
</div>

<div class="stat">
<div id="m" class="big">0</div>
Марки
</div>

<div class="stat">
<div id="c" class="big">0</div>
Комплект
</div>

</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let objects=[];
let map;
let layer;

async function load(){

const r=await fetch("objects.json");
objects=await r.json();

map=L.map("map").setView([42.7339,25.4858],7);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:"© OpenStreetMap"
}).addTo(map);

layer=L.layerGroup().addTo(map);

drawMarkers();
renderList();
updateStats();

}

function data(id){
return JSON.parse(localStorage.getItem("obj-"+id)||"{}");
}

function save(id,key,val){
const d=data(id);
d[key]=val;
localStorage.setItem("obj-"+id,JSON.stringify(d));
drawMarkers();
renderList();
updateStats();
}

function drawMarkers(){

layer.clearLayers();

objects.forEach(o=>{

if(o.lat==null||o.lng==null)return;

const d=data(o.id);

const color=d.visited?"#16a34a":"#dc2626";

const icon=L.divIcon({
className:"",
html:`<div style="width:18px;height:18px;border-radius:50%;background:${color};border:3px solid white;"></div>`,
iconSize:[18,18],
iconAnchor:[9,9]
});

L.marker([o.lat,o.lng],{icon})
.addTo(layer)
.bindPopup(`<b>${o.name}</b><br>${o.city}`);

});

}

function renderList(){

const q=document.getElementById("search").value.toLowerCase();
const box=document.getElementById("list");

box.innerHTML="";

objects
.filter(o=>(o.name+" "+o.city+" "+o.number).toLowerCase().includes(q))
.forEach(o=>{

const d=data(o.id);

box.innerHTML+=`

<div class="card">

<div><b>№${o.number}</b></div>

<h3>${o.name}</h3>

<div>📍 ${o.city}</div>

<label>
<input type="checkbox"
${d.visited?"checked":""}
onchange="save('${o.id}','visited',this.checked)">
Посетен
</label>

<label>
<input type="checkbox"
${d.stamp?"checked":""}
onchange="save('${o.id}','stamp',this.checked)">
Печат
</label>

<label>
<input type="checkbox"
${d.mark?"checked":""}
onchange="save('${o.id}','mark',this.checked)">
Марка
</label>

<input type="date"
value="${d.date||""}"
onchange="save('${o.id}','date',this.value)"
style="width:100%;margin-top:8px;">

<textarea
placeholder="Бележка"
onchange="save('${o.id}','note',this.value)"
>${d.note||""}</textarea>

</div>

`;

});

}

function updateStats(){

let v=0,s=0,m=0,c=0;

objects.forEach(o=>{

const d=data(o.id);

if(d.visited)v++;
if(d.stamp)s++;
if(d.mark)m++;
if(d.visited&&d.stamp&&d.mark)c++;

});

document.getElementById("v").innerText=v;
document.getElementById("s").innerText=s;
document.getElementById("m").innerText=m;
document.getElementById("c").innerText=c;

}

function openTab(t){

["map","list","progress"].forEach(x=>{
document.getElementById(x+"Page").classList.remove("active");
});

["b1","b2","b3"].forEach(x=>{
document.getElementById(x).classList.remove("active");
});

if(t=="map"){
document.getElementById("mapPage").classList.add("active");
document.getElementById("b1").classList.add("active");
setTimeout(()=>map.invalidateSize(),100);
}

if(t=="list"){
document.getElementById("listPage").classList.add("active");
document.getElementById("b2").classList.add("active");
}

if(t=="progress"){
document.getElementById("progressPage").classList.add("active");
document.getElementById("b3").classList.add("active");
}

}

if("serviceWorker" in navigator){
navigator.serviceWorker.register("service-worker.js");
}

load();

</script>

</body>
</html>
